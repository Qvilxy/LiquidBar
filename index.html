<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Big Cherry Boobs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            background: radial-gradient(ellipse at center, #2c2c2c 0%, #1a1a1a 50%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            color: #fff;
            position: relative;
        }

        /* ===== HEADER / LOGO ===== */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px 0;
            z-index: 10;
        }

        .header-logo {
            max-width: 180px;
            height: auto;
        }

        /* ===== MAIN CONTENT — центрирование ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .tab-content {
            display: none;
            text-align: center;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #e0e0e0;
        }

        .tab-content p {
            font-size: 15px;
            color: #888;
        }

        /* ===== BOTTOM NAVIGATION — компактная ===== */
        .bottom-nav {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 210px;
            height: 52px;
            background: #b8b8b8;
            border-radius: 26px;
            display: flex;
            padding: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding: 6px 0;
        }

        .nav-item .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item .nav-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .nav-item .nav-label {
            font-size: 11px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        /* Active — синий фон */
        .nav-item.active {
            background: #2563eb;
        }

        .nav-item.active .nav-label {
            color: #ffffff;
        }

        /* Inactive — без фона, чёрный текст */
        .nav-item:not(.active) .nav-label {
            color: #1a1a1a;
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Rainbow border */
        .nav-item.interacting {
            border: 2px solid transparent;
            background-image: linear-gradient(#b8b8b8, #b8b8b8),
                              linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .nav-item.active.interacting {
            background-image: linear-gradient(#2563eb, #2563eb),
                              linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content.active {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <img src="bcblogotext.PNG" alt="Logo" class="header-logo">
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="tab-content active" id="tab-play">
            <h2>🎮 Играть</h2>
            <p>Добро пожаловать в игру!</p>
        </div>
        <div class="tab-content" id="tab-profile">
            <h2>👤 Профиль</h2>
            <p>Здесь будет ваш профиль</p>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-item active" data-tab="play" id="nav-play">
            <div class="nav-icon">
                <img src="icon_chip_blue.png" alt="Играть">
            </div>
            <span class="nav-label">Играть</span>
        </div>
        <div class="nav-item" data-tab="profile" id="nav-profile">
            <div class="nav-icon">
                <img src="icon_profile_black.png" alt="Профиль">
            </div>
            <span class="nav-label">Профиль</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const navItems = document.querySelectorAll('.nav-item');
        const tabContents = document.querySelectorAll('.tab-content');

        const icons = {
            play:    { active: 'icon_chip_blue.png',   inactive: 'icon_chip_black.png'   },
            profile: { active: 'icon_profile_blue.png', inactive: 'icon_profile_black.png' }
        };

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const tabName = item.getAttribute('data-tab');

                navItems.forEach(n => {
                    n.classList.remove('active');
                    const tab = n.getAttribute('data-tab');
                    n.querySelector('img').src = icons[tab].inactive;
                });
                tabContents.forEach(t => t.classList.remove('active'));

                item.classList.add('active');
                item.querySelector('img').src = icons[tabName].active;
                document.getElementById('tab-' + tabName).classList.add('active');

                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.selectionChanged();
                }
            });

            item.addEventListener('touchstart', () => item.classList.add('interacting'));
            item.addEventListener('touchend',   () => setTimeout(() => item.classList.remove('interacting'), 300));
            item.addEventListener('mousedown',  () => item.classList.add('interacting'));
            item.addEventListener('mouseup',    () => setTimeout(() => item.classList.remove('interacting'), 300));
        });
    </script>

</body>
</html>
