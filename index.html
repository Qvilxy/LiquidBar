<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Big Cherry Boobs</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            background: radial-gradient(ellipse at center, #2c2c2c 0%, #1a1a1a 50%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            color: #fff;
            position: relative;
        }

        /* ===== MAIN CONTENT — пустой ===== */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .tab-content {
            display: none;
            text-align: center;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== BOTTOM NAVIGATION — Liquid Glass ===== */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 44px;
            background: rgba(180, 180, 180, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 22px;
            display: flex;
            padding: 3px;
            box-shadow: 
                0 2px 12px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding: 4px 0;
        }

        .nav-item .nav-icon {
            width: 20px;
            height: 20px;
            margin-bottom: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item .nav-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .nav-item .nav-label {
            font-size: 10px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        /* Active — серый фон, синяя иконка, синий текст */
        .nav-item.active {
            background: rgba(160, 160, 160, 0.8);
        }

        .nav-item.active .nav-label {
            color: #2563eb;
        }

        /* Inactive — прозрачный, черная иконка, черный текст */
        .nav-item:not(.active) .nav-label {
            color: #1a1a1a;
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        /* Rainbow border on interaction */
        .nav-item.interacting {
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(160,160,160,0.9), rgba(160,160,160,0.9)),
                              linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000);
            background-origin: border-box;
            background-clip: padding-box, border-box;
        }

        .nav-item.active.interacting {
            background-image: linear-gradient(rgba(160,160,160,0.9), rgba(160,160,160,0.9)),
                              linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content.active {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>
<body>

    <!-- MAIN CONTENT — пустой -->
    <div class="content">
        <div class="tab-content active" id="tab-play"></div>
        <div class="tab-content" id="tab-profile"></div>
    </div>

    <!-- BOTTOM NAVIGATION — Liquid Glass -->
    <div class="bottom-nav">
        <div class="nav-item active" data-tab="play" id="nav-play">
            <div class="nav-icon">
                <img src="icon_chip_blue.png" alt="Играть">
            </div>
            <span class="nav-label">Играть</span>
        </div>
        <div class="nav-item" data-tab="profile" id="nav-profile">
            <div class="nav-icon">
                <img src="icon_profile_black.png" alt="Профиль">
            </div>
            <span class="nav-label">Профиль</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const navItems = document.querySelectorAll('.nav-item');
        const tabContents = document.querySelectorAll('.tab-content');

        const icons = {
            play:    { active: 'icon_chip_blue.png',   inactive: 'icon_chip_black.png'   },
            profile: { active: 'icon_profile_blue.png', inactive: 'icon_profile_black.png' }
        };

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const tabName = item.getAttribute('data-tab');

                navItems.forEach(n => {
                    n.classList.remove('active');
                    const tab = n.getAttribute('data-tab');
                    n.querySelector('img').src = icons[tab].inactive;
                });
                tabContents.forEach(t => t.classList.remove('active'));

                item.classList.add('active');
                item.querySelector('img').src = icons[tabName].active;
                document.getElementById('tab-' + tabName).classList.add('active');

                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.selectionChanged();
                }
            });

            item.addEventListener('touchstart', () => item.classList.add('interacting'));
            item.addEventListener('touchend',   () => setTimeout(() => item.classList.remove('interacting'), 300));
            item.addEventListener('mousedown',  () => item.classList.add('interacting'));
            item.addEventListener('mouseup',    () => setTimeout(() => item.classList.remove('interacting'), 300));
        });
    </script>

</body>
</html>
